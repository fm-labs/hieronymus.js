<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Table</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          text-align: center;
          margin: 0;
          padding: 0;
      }
      canvas {
          border: 1px solid black;
          margin-top: 20px;
      }
  </style>
</head>
<body>

<canvas id="rouletteCanvas" width="800" height="500"></canvas>

<script>
  const canvas = document.getElementById('rouletteCanvas');
  const ctx = canvas.getContext('2d');

  const tableWidth = canvas.width;
  const tableHeight = canvas.height;

  const gridRows = 3;
  const gridCols = 12;
  const cellWidth = tableWidth / gridCols;
  const cellHeight = tableHeight / gridRows;

  // Define colors for roulette numbers
  const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
  const blackNumbers = [2, 4, 6, 8, 10, 11, 13, 15, 17, 20, 22, 24, 26, 28, 29, 31, 33, 35];

  // Draw the roulette table grid
  function drawTable() {
    ctx.clearRect(0, 0, tableWidth, tableHeight);

    // Draw the main betting area (numbers grid)
    for (let i = 0; i < gridCols; i++) {
      for (let j = 0; j < gridRows; j++) {
        const x = i * cellWidth;
        const y = j * cellHeight;
        ctx.strokeStyle = 'black';
        ctx.strokeRect(x, y, cellWidth, cellHeight);

        const number = (j * gridCols) + i + 1;
        const color = redNumbers.includes(number) ? 'red' :
          blackNumbers.includes(number) ? 'black' : 'green';

        ctx.fillStyle = color;
        ctx.fillText(number, x + cellWidth / 2, y + cellHeight / 2);
      }
    }
  }

  // Call the drawTable function
  drawTable();
</script>

</body>
</html>
