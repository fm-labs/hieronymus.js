<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Country Borders on HTML Canvas (GeoJSON)</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827cc;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22d3ee;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      #wrap {
        position: fixed;
        inset: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 3;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border-radius: 16px;
        box-shadow: 0 10px 30px #0008;
        padding: 14px 14px;
        max-width: 380px;
      }
      #ui h1 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      #ui .row {
        display: flex;
        gap: 8px;
        margin: 6px 0;
        align-items: center;
        flex-wrap: wrap;
      }
      #ui input[type='text'],
      #ui button,
      #ui select,
      #ui label.upload {
        border: 1px solid #334155;
        background: #0b1220;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        outline: none;
      }
      #ui input[type='text'] {
        flex: 1;
        min-width: 180px;
      }
      #ui button {
        cursor: pointer;
      }
      #ui small {
        color: var(--muted);
        display: block;
        margin-top: 6px;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        background: #0b1220;
        border: 1px solid #334155;
        color: var(--text);
        padding: 6px 8px;
        border-radius: 10px;
        font-size: 12px;
        display: none;
        z-index: 4;
        box-shadow: 0 10px 25px #0008;
      }
      #legend {
        position: fixed;
        right: 16px;
        bottom: 16px;
        background: #111827cc;
        color: var(--muted);
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12px;
        z-index: 3;
        backdrop-filter: blur(8px);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      .pill {
        padding: 4px 8px;
        border: 1px solid #334155;
        border-radius: 999px;
      }
      label.upload {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      label.upload input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="map"></canvas>
      <div id="ui">
        <h1>World Borders (Canvas)</h1>
        <div class="row">
          <button id="fit">Fit world</button>
          <button id="reset">Reset</button>
          <select id="projection">
            <option value="mercator" selected>Mercator</option>
            <option value="equirect">Equirectangular</option>
          </select>
        </div>
        <div class="row">
          <input id="search" list="countries" placeholder="Search country… (Enter to zoom)" />
          <button id="clearSearch" title="Clear">✕</button>
        </div>
        <datalist id="countries"></datalist>
        <div class="row">
          <button id="toggleFill">Toggle fill</button>
          <label class="upload" title="Drop or choose a GeoJSON file">
            <span class="pill">＋ Load GeoJSON</span>
            <input
              id="file"
              type="file"
              accept=".json,.geojson,application/geo+json,application/json"
            />
          </label>
        </div>
        <small>
          Default data: Natural Earth admin-0 countries (public domain) mirrored as GeoJSON. You can
          also drop your own GeoJSON (Polygon/MultiPolygon with <code>properties.NAME</code> or
          <code>ADMIN</code>).
        </small>
      </div>
      <div id="legend">Drag = pan · Wheel = zoom · Hover = name · Double-click = zoom in</div>
      <div id="tooltip"></div>
    </div>

    <script>
      ;(() => {
        const DATA_URL =
          'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson'

        // Canvas setup (handles HiDPI)
        const canvas = document.getElementById('map')
        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true })
        let dpr = Math.max(1, window.devicePixelRatio || 1)
        const state = {
          features: [],
          fillEnabled: true,
          projection: 'mercator',
          // World bounds in projection space
          world: { minX: -180, maxX: 180, minY: null, maxY: null }, // Y depends on projection
          // View transform
          baseScale: 1,
          zoom: 1,
          panX: 0,
          panY: 0,
          marginX: 0,
          marginY: 0,
          hover: null,
        }

        // UI
        const countriesDL = document.getElementById('countries')
        const tooltip = document.getElementById('tooltip')

        // Projections
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
        const rad = (d) => (d * Math.PI) / 180
        const mercY = (lat) => {
          const max = 85.05112878 // WebMercator limit
          const φ = rad(clamp(lat, -max, max))
          return (Math.log(Math.tan(Math.PI / 4 + φ / 2)) * 180) / Math.PI // degrees-like range
        }
        const projectFns = {
          mercator: (lon, lat) => [lon, mercY(lat)],
          equirect: (lon, lat) => [lon, lat],
        }

        function setCanvasSize() {
          const { clientWidth: w, clientHeight: h } = canvas
          dpr = Math.max(1, window.devicePixelRatio || 1)
          canvas.width = Math.floor(w * dpr)
          canvas.height = Math.floor(h * dpr)
          ctx.setTransform(1, 0, 0, 1, 0, 0)
          ctx.scale(dpr, dpr)
          fitWorld()
        }

        function computeWorldYBounds() {
          const proj = projectFns[state.projection]
          // Use theoretical extremes to avoid scanning
          const yTop = proj(0, 90)[1],
            yBottom = proj(0, -90)[1]
          state.world.minY = Math.min(yTop, yBottom)
          state.world.maxY = Math.max(yTop, yBottom)
          if (state.projection === 'mercator') {
            // Use Mercator caps
            state.world.minY = mercY(-85.05112878)
            state.world.maxY = mercY(85.05112878)
          }
        }

        function fitWorld() {
          computeWorldYBounds()
          const cw = canvas.clientWidth,
            ch = canvas.clientHeight
          const worldW = state.world.maxX - state.world.minX // 360
          const worldH = state.world.maxY - state.world.minY
          const scaleX = cw / worldW
          const scaleY = ch / worldH
          state.baseScale = Math.min(scaleX, scaleY)
          // center with margins
          state.marginX = (cw - worldW * state.baseScale) / 2
          state.marginY = (ch - worldH * state.baseScale) / 2
          state.zoom = 1
          state.panX = 0
          state.panY = 0
          draw()
        }

        function worldToPx([wx, wy]) {
          const cw = canvas.clientWidth,
            ch = canvas.clientHeight
          const x =
            (wx - state.world.minX) * state.baseScale * state.zoom + state.marginX + state.panX
          const y =
            (state.world.maxY - wy) * state.baseScale * state.zoom + state.marginY + state.panY
          return [x, y]
        }
        function pxToWorld([px, py]) {
          const wx =
            (px - state.marginX - state.panX) / (state.baseScale * state.zoom) + state.world.minX
          const wy =
            state.world.maxY - (py - state.marginY - state.panY) / (state.baseScale * state.zoom)
          return [wx, wy]
        }

        // Build projected polygons for faster draw & hit-tests every render
        function buildPaths() {
          const proj = projectFns[state.projection]
          for (const f of state.features) {
            const geom = f.geometry
            const buildPathForRings = (rings) => {
              const p = new Path2D()
              for (const ring of rings) {
                ring.forEach((pt, i) => {
                  const [lon, lat] = pt
                  const [wx, wy] = proj(lon, lat)
                  const [x, y] = worldToPx([wx, wy])
                  if (i === 0) p.moveTo(x, y)
                  else p.lineTo(x, y)
                })
                p.closePath()
              }
              return p
            }
            if (geom.type === 'Polygon') {
              f._path = buildPathForRings(geom.coordinates)
            } else if (geom.type === 'MultiPolygon') {
              const p = new Path2D()
              for (const poly of geom.coordinates) {
                const sub = buildPathForRings(poly)
                p.addPath(sub)
              }
              f._path = p
            } else {
              f._path = null
            }
          }
        }

        function draw() {
          const w = canvas.clientWidth,
            h = canvas.clientHeight
          ctx.clearRect(0, 0, w, h)

          // water
          ctx.fillStyle = '#0b1220'
          ctx.fillRect(0, 0, w, h)

          if (!state.features.length) return

          buildPaths()

          // land
          ctx.lineWidth = Math.max(0.5, 1.2 / state.zoom)
          ctx.strokeStyle = '#0ea5e9'
          ctx.fillStyle = state.fillEnabled ? '#083344' : 'transparent'

          for (const f of state.features) {
            if (!f._path) continue
            if (state.fillEnabled) ctx.fill(f._path, 'evenodd')
            ctx.stroke(f._path)
          }

          // hover highlight
          if (state.hover && state.hover._path) {
            ctx.lineWidth = Math.max(1.5, 2.2 / state.zoom)
            ctx.strokeStyle = '#22d3ee'
            ctx.fillStyle = 'rgba(34,211,238,0.15)'
            ctx.stroke(state.hover._path)
            if (state.fillEnabled) ctx.fill(state.hover._path, 'evenodd')
          }
        }

        // Load GeoJSON (world) and wire UI
        async function loadGeoJSON(urlOrBlob) {
          let gj
          try {
            if (urlOrBlob instanceof Blob) {
              gj = JSON.parse(await urlOrBlob.text())
            } else {
              const res = await fetch(urlOrBlob)
              gj = await res.json()
            }
          } catch (e) {
            alert('Failed to load GeoJSON: ' + e)
            return
          }
          // Normalize features
          const feats =
            gj.type === 'FeatureCollection' ? gj.features : gj.type === 'Feature' ? [gj] : [] // assume geometry collection unsupported here
          state.features = feats.filter(
            (f) =>
              f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'),
          )
          // Build datalist for search
          countriesDL.innerHTML = ''
          for (const f of state.features) {
            const n = countryName(f)
            if (!n) continue
            const o = document.createElement('option')
            o.value = n
            countriesDL.appendChild(o)
          }
          fitWorld()
        }

        function countryName(f) {
          const p = f.properties || {}
          return p.ADMIN || p.NAME_LONG || p.NAME || p.name || p.admin || p.sovereignt || null
        }

        // Hover detection using isPointInPath
        let lastHoverXY = null
        function handleHover(ev) {
          const rect = canvas.getBoundingClientRect()
          const x = ev.clientX - rect.left,
            y = ev.clientY - rect.top
          lastHoverXY = [x, y]
          let hit = null
          // Iterate features (could be optimized via spatial index; 110m is fine)
          for (const f of state.features) {
            if (!f._path) continue
            if (ctx.isPointInPath(f._path, x, y)) {
              hit = f
              break
            }
          }
          state.hover = hit
          if (hit) {
            tooltip.style.display = 'block'
            tooltip.textContent = countryName(hit) || 'Unknown'
            tooltip.style.left = ev.clientX + 12 + 'px'
            tooltip.style.top = ev.clientY + 12 + 'px'
          } else {
            tooltip.style.display = 'none'
          }
          draw()
        }

        // Pan & zoom
        let isPanning = false,
          panStart = [0, 0]
        canvas.addEventListener('mousedown', (e) => {
          isPanning = true
          panStart = [e.clientX - state.panX, e.clientY - state.panY]
        })
        window.addEventListener('mouseup', () => (isPanning = false))
        window.addEventListener('mousemove', (e) => {
          if (isPanning) {
            state.panX = e.clientX - panStart[0]
            state.panY = e.clientY - panStart[1]
            draw()
          } else {
            handleHover(e)
          }
        })
        canvas.addEventListener('mouseleave', () => {
          state.hover = null
          tooltip.style.display = 'none'
          draw()
        })

        canvas.addEventListener(
          'wheel',
          (e) => {
            e.preventDefault()
            const rect = canvas.getBoundingClientRect()
            const mouse = [e.clientX - rect.left, e.clientY - rect.top]
            const before = pxToWorld(mouse)
            const factor = Math.exp(-e.deltaY * 0.0015)
            const newZoom = clamp(state.zoom * factor, 0.5, 50)
            // keep mouse world point stable
            state.zoom = newZoom
            const after = worldToPx(before)
            state.panX += mouse[0] - after[0]
            state.panY += mouse[1] - after[1]
            draw()
          },
          { passive: false },
        )

        canvas.addEventListener('dblclick', (e) => {
          const rect = canvas.getBoundingClientRect()
          const mouse = [e.clientX - rect.left, e.clientY - rect.top]
          const before = pxToWorld(mouse)
          const factor = 1.8
          state.zoom = clamp(state.zoom * factor, 0.5, 50)
          const after = worldToPx(before)
          state.panX += mouse[0] - after[0]
          state.panY += mouse[1] - after[1]
          draw()
        })

        // Search + zoom-to-country
        function bboxOfFeature(f, proj) {
          let minX = Infinity,
            minY = Infinity,
            maxX = -Infinity,
            maxY = -Infinity
          const addPt = (lon, lat) => {
            const [wx, wy] = proj(lon, lat)
            if (wx < minX) minX = wx
            if (wx > maxX) maxX = wx
            if (wy < minY) minY = wy
            if (wy > maxY) maxY = wy
          }
          const processRings = (rings) =>
            rings.forEach((r) => r.forEach(([lon, lat]) => addPt(lon, lat)))
          if (f.geometry.type === 'Polygon') processRings(f.geometry.coordinates)
          else if (f.geometry.type === 'MultiPolygon') f.geometry.coordinates.forEach(processRings)
          return { minX, minY, maxX, maxY }
        }
        function zoomToFeature(f) {
          const proj = projectFns[state.projection]
          const bb = bboxOfFeature(f, proj)
          const cw = canvas.clientWidth,
            ch = canvas.clientHeight
          const wW = bb.maxX - bb.minX,
            wH = bb.maxY - bb.minY
          const scaleX = cw / wW,
            scaleY = ch / wH
          state.baseScale = Math.min(scaleX, scaleY) * 0.85 // add some padding
          state.marginX =
            (cw - wW * state.baseScale) / 2 - (bb.minX - state.world.minX) * state.baseScale
          state.marginY =
            (ch - wH * state.baseScale) / 2 - (state.world.maxY - bb.maxY) * state.baseScale
          state.zoom = 1
          state.panX = 0
          state.panY = 0
          draw()
        }

        document.getElementById('search').addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return
          const q = e.currentTarget.value.trim().toLowerCase()
          if (!q) return
          const f = state.features.find((f) => (countryName(f) || '').toLowerCase() === q)
          if (f) zoomToFeature(f)
        })
        document.getElementById('clearSearch').addEventListener('click', () => {
          const i = document.getElementById('search')
          i.value = ''
          i.focus()
        })

        // Buttons & inputs
        document.getElementById('fit').onclick = fitWorld
        document.getElementById('reset').onclick = async () => {
          await loadGeoJSON(DATA_URL)
        }
        document.getElementById('toggleFill').onclick = () => {
          state.fillEnabled = !state.fillEnabled
          draw()
        }
        document.getElementById('projection').onchange = (e) => {
          state.projection = e.target.value
          fitWorld()
        }

        const file = document.getElementById('file')
        file.addEventListener('change', async (e) => {
          const f = e.target.files[0]
          if (f) await loadGeoJSON(f)
          e.target.value = ''
        })

        // Drag & drop
        document.addEventListener('dragover', (e) => {
          e.preventDefault()
        })
        document.addEventListener('drop', async (e) => {
          e.preventDefault()
          const f = [...(e.dataTransfer.files || [])].find(
            (f) => /geojson|json/.test(f.type) || /\.geojson|\.json$/i.test(f.name),
          )
          if (f) await loadGeoJSON(f)
        })

        // Resize
        const ro = new ResizeObserver(setCanvasSize)
        ro.observe(canvas)

        // Init
        setCanvasSize()
        loadGeoJSON(DATA_URL)
      })()
    </script>
  </body>
</html>
