<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canvas Map + Named Coordinates</title>
  <style>
      :root { --bg:#0f172a; --panel:#111827cc; --text:#e5e7eb; --muted:#94a3b8; --accent:#22d3ee; }
      html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
      #wrap { position:fixed; inset:0; }
      canvas { width:100%; height:100%; display:block; }
      #ui {
          position: fixed; top: 16px; left: 16px; z-index: 3; background: var(--panel); backdrop-filter: blur(8px);
          border-radius: 16px; box-shadow: 0 10px 30px #0008; padding: 14px; max-width: 420px;
      }
      #ui h1 { margin:0 0 8px; font-size:16px; font-weight:700; }
      #ui .row { display:flex; gap:8px; margin:6px 0; align-items:center; flex-wrap:wrap; }
      #ui input, #ui button, #ui select, #ui label.upload {
          border:1px solid #334155; background:#0b1220; color:var(--text); padding:8px 10px; border-radius:10px; outline:none;
      }
      #ui input[type="text"]{ flex:1; min-width:180px; }
      #ui small { color:var(--muted); display:block; margin-top:6px }
      label.upload { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
      label.upload input { display:none; }
      #legend {
          position: fixed; right: 16px; bottom: 16px; background:#111827cc; color:var(--muted);
          padding:10px 12px; border-radius:12px; font-size:12px; z-index:3; backdrop-filter: blur(8px);
      }
      #tooltip {
          position: fixed; pointer-events:none; background:#0b1220; border:1px solid #334155; color:var(--text);
          padding:6px 8px; border-radius:10px; font-size:12px; display:none; z-index:4; box-shadow:0 10px 25px #0008;
      }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="map"></canvas>

  <div id="ui">
    <h1>World + Points (Canvas)</h1>
    <div class="row">
      <button id="fit">Fit world</button>
      <button id="reset">Reset</button>
      <select id="projection">
        <option value="mercator" selected>Mercator</option>
        <option value="equirect">Equirectangular</option>
      </select>
      <button id="toggleFill">Toggle fill</button>
    </div>

    <div class="row">
      <input id="searchCountry" list="countries" placeholder="Search country (Enter)" />
      <input id="searchPoint" list="points" placeholder="Search point (Enter)" />
      <button id="clearSearch" title="Clear">✕</button>
    </div>
    <datalist id="countries"></datalist>
    <datalist id="points"></datalist>

    <div class="row">
      <label class="upload" title="Load GeoJSON of countries (optional)">
        <span>＋ Load GeoJSON</span>
        <input id="fileGeoJSON" type="file" accept=".json,.geojson,application/geo+json,application/json" />
      </label>
      <label class="upload" title="Load your Named Coordinates JSON">
        <span>＋ Load Points JSON</span>
        <input id="filePoints" type="file" accept=".json,application/json" />
      </label>
      <button id="addSample">Add sample points</button>
    </div>

    <small>
      Points JSON format (array of objects):<br>
      <code>[{"name":"Vienna","lon":16.3738,"lat":48.2082},{"name":"Cairo","lon":31.2357,"lat":30.0444}]</code>
    </small>
  </div>

  <div id="legend">Drag = pan · Wheel = zoom · Hover = info · Click point = zoom · Double-click = zoom in</div>
  <div id="tooltip"></div>
</div>

<script>
  (() => {
    // --- Data sources (swap if you like)
    const DATA_URL = 'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson';

    // --- Canvas + state
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
    let dpr = Math.max(1, window.devicePixelRatio || 1);

    const state = {
      features: [],       // country polygons (GeoJSON features)
      points: [],         // { name, lon, lat }
      fillEnabled: true,
      projection: 'mercator',
      // world/projection bounds
      world: { minX: -180, maxX: 180, minY: null, maxY: null },
      // view transform
      baseScale: 1, zoom: 1, panX: 0, panY: 0, marginX: 0, marginY: 0,
      hoverCountry: null,
      hoverPointIdx: -1,
      anim: null
    };

    // --- Projections
    const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
    const rad = d=>d*Math.PI/180;
    const mercY = (lat)=>{
      const max = 85.05112878;
      const φ = rad(clamp(lat,-max,max));
      return Math.log(Math.tan(Math.PI/4 + φ/2)) * 180/Math.PI;
    };
    const projectFns = {
      mercator: (lon,lat)=>[lon, mercY(lat)],
      equirect: (lon,lat)=>[lon, lat]
    };

    // --- Sizing
    function setCanvasSize() {
      const { clientWidth:w, clientHeight:h } = canvas;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      fitWorld();
    }
    function computeWorldYBounds() {
      const proj = projectFns[state.projection];
      if (state.projection === 'mercator') {
        state.world.minY = mercY(-85.05112878);
        state.world.maxY = mercY(85.05112878);
      } else {
        state.world.minY = proj(0,-90)[1];
        state.world.maxY = proj(0,90)[1];
      }
    }
    function fitWorld() {
      computeWorldYBounds();
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      const worldW = state.world.maxX - state.world.minX; // 360
      const worldH = state.world.maxY - state.world.minY;
      const scaleX = cw / worldW, scaleY = ch / worldH;
      state.baseScale = Math.min(scaleX, scaleY);
      state.marginX = (cw - worldW * state.baseScale)/2;
      state.marginY = (ch - worldH * state.baseScale)/2;
      state.zoom = 1; state.panX = 0; state.panY = 0;
      draw();
    }

    // --- Coordinate transforms
    function worldToPx([wx, wy]) {
      const x = (wx - state.world.minX) * state.baseScale * state.zoom + state.marginX + state.panX;
      const y = (state.world.maxY - wy) * state.baseScale * state.zoom + state.marginY + state.panY;
      return [x, y];
    }
    function pxToWorld([px, py]) {
      const wx = (px - state.marginX - state.panX) / (state.baseScale * state.zoom) + state.world.minX;
      const wy = state.world.maxY - (py - state.marginY - state.panY) / (state.baseScale * state.zoom);
      return [wx, wy];
    }
    function lonLatToPx(lon, lat) {
      const [wx, wy] = projectFns[state.projection](lon, lat);
      return worldToPx([wx, wy]);
    }

    // --- Build paths for polygons (per draw)
    function buildCountryPaths() {
      const proj = projectFns[state.projection];
      for (const f of state.features) {
        const g = f.geometry;
        const pathForRings = (rings)=>{
          const p = new Path2D();
          rings.forEach((ring)=>{
            ring.forEach(([lon,lat],i)=>{
              const [wx, wy] = proj(lon,lat);
              const [x,y] = worldToPx([wx,wy]);
              if (i===0) p.moveTo(x,y); else p.lineTo(x,y);
            });
            p.closePath();
          });
          return p;
        };
        if (g.type === 'Polygon') {
          f._path = pathForRings(g.coordinates);
        } else if (g.type === 'MultiPolygon') {
          const p = new Path2D();
          g.coordinates.forEach(poly => p.addPath(pathForRings(poly)));
          f._path = p;
        } else f._path = null;
      }
    }

    // --- Draw everything
    function draw() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle = '#0b1220'; ctx.fillRect(0,0,w,h);

      // Countries
      if (state.features.length) {
        buildCountryPaths();
        ctx.lineWidth = Math.max(0.5, 1.2 / state.zoom);
        ctx.strokeStyle = '#0ea5e9';
        ctx.fillStyle = state.fillEnabled ? '#083344' : 'transparent';
        for (const f of state.features) {
          if (!f._path) continue;
          if (state.fillEnabled) ctx.fill(f._path, 'evenodd');
          ctx.stroke(f._path);
        }
        // Hover highlight
        if (state.hoverCountry && state.hoverCountry._path) {
          ctx.lineWidth = Math.max(1.5, 2.2 / state.zoom);
          ctx.strokeStyle = '#22d3ee';
          ctx.fillStyle = 'rgba(34,211,238,0.15)';
          ctx.stroke(state.hoverCountry._path);
          if (state.fillEnabled) ctx.fill(state.hoverCountry._path, 'evenodd');
        }
      }

      // Points
      if (state.points.length) {
        const r = Math.max(2, 4 / Math.sqrt(state.zoom)); // point radius scales a bit
        ctx.lineWidth = 1;
        for (let i=0;i<state.points.length;i++) {
          const p = state.points[i];
          const [x,y] = lonLatToPx(p.lon, p.lat);
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
          if (i === state.hoverPointIdx) {
            ctx.fillStyle = '#22d3ee'; ctx.strokeStyle = '#22d3ee';
          } else {
            ctx.fillStyle = '#e2e8f0'; ctx.strokeStyle = '#0f172a';
          }
          ctx.fill(); ctx.stroke();

          // Optional labels when zoomed in
          if (state.zoom > 2.5) {
            ctx.font = '12px system-ui, sans-serif';
            ctx.textBaseline = 'top';
            ctx.fillStyle = 'rgba(229,231,235,0.9)';
            ctx.fillText(p.name || '', x + r + 4, y + 2);
          }
          p._px = [x,y]; p._r = r; // cache for hit testing
        }
      }
    }

    // --- Countries: helpers
    function countryName(f){
      const p = f.properties || {};
      return p.ADMIN || p.NAME_LONG || p.NAME || p.name || p.admin || p.sovereignt || null;
    }
    function bboxOfFeature(f, proj) {
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      const add=(lon,lat)=>{ const [wx,wy]=proj(lon,lat); if(wx<minX)minX=wx; if(wx>maxX)maxX=wx; if(wy<minY)minY=wy; if(wy>maxY)maxY=wy; };
      const rings=(arr)=>arr.forEach(r=>r.forEach(([lon,lat])=>add(lon,lat)));
      if (f.geometry.type==='Polygon') rings(f.geometry.coordinates);
      else f.geometry.coordinates.forEach(rings);
      return {minX,minY,maxX,maxY};
    }
    function zoomToFeature(f) {
      const proj = projectFns[state.projection];
      const bb = bboxOfFeature(f, proj);
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      const wW = bb.maxX - bb.minX, wH = bb.maxY - bb.minY;
      const scaleX = cw / wW, scaleY = ch / wH;
      state.baseScale = Math.min(scaleX, scaleY) * 0.85;
      state.marginX = (cw - wW * state.baseScale) / 2 - (bb.minX - state.world.minX) * state.baseScale;
      state.marginY = (ch - wH * state.baseScale) / 2 - (state.world.maxY - bb.maxY) * state.baseScale;
      state.zoom = 1; state.panX = 0; state.panY = 0;
      draw();
    }

    // --- Programmatic navigation to lon/lat
    function goTo(lon, lat, targetZoom = 6, durationMs = 600) {
      // find current center in world coords, compute target pan/zoom keeping lon/lat centered
      const before = lonLatToPx(lon, lat);
      const start = { zoom: state.zoom, panX: state.panX, panY: state.panY };
      const end = (() => {
        const newZoom = clamp(targetZoom, 0.5, 50);
        const [afterX, afterY] = (() => {
          const [wx, wy] = projectFns[state.projection](lon, lat);
          return worldToPx([wx, wy]);
        })();
        // adjust panning so the lon/lat ends up in the center of the canvas
        const cx = canvas.clientWidth / 2;
        const cy = canvas.clientHeight / 2;
        const panX = state.panX + (cx - afterX);
        const panY = state.panY + (cy - afterY);
        return { zoom: newZoom, panX, panY };
      })();

      // animate (ease in-out)
      cancelAnimationFrame(state.anim);
      const t0 = performance.now();
      const ease = t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      const animate = (now)=>{
        const t = clamp((now - t0)/durationMs, 0, 1);
        const k = ease(t);
        state.zoom = start.zoom + (end.zoom - start.zoom) * k;
        state.panX = start.panX + (end.panX - start.panX) * k;
        state.panY = start.panY + (end.panY - start.panY) * k;
        draw();
        if (t < 1) state.anim = requestAnimationFrame(animate);
      };
      state.anim = requestAnimationFrame(animate);
    }
    // Expose for console/testing
    window.goTo = goTo;

    // --- Loading data
    async function loadGeoJSON(urlOrBlob) {
      try {
        const gj = urlOrBlob instanceof Blob
          ? JSON.parse(await urlOrBlob.text())
          : await (await fetch(urlOrBlob)).json();
        const feats = gj.type==='FeatureCollection' ? gj.features
          : gj.type==='Feature' ? [gj] : [];
        state.features = feats.filter(f=>f.geometry && (f.geometry.type==='Polygon'||f.geometry.type==='MultiPolygon'));
        // datalist for countries
        const dl = document.getElementById('countries'); dl.innerHTML='';
        state.features.forEach(f=>{
          const n = countryName(f); if(!n) return;
          const o = document.createElement('option'); o.value = n; dl.appendChild(o);
        });
        fitWorld();
      } catch (e) { alert('Failed to load GeoJSON: ' + e); }
    }

    function loadPointsArray(arr) {
      // expects [{name,lon,lat}, ...]
      const clean = [];
      for (const it of arr||[]) {
        const lon = Number(it.lon), lat = Number(it.lat);
        if (Number.isFinite(lon) && Number.isFinite(lat)) {
          clean.push({ name: String(it.name||''), lon, lat });
        }
      }
      state.points = clean;
      // datalist for points
      const dl = document.getElementById('points'); dl.innerHTML='';
      for (const p of state.points) {
        if (!p.name) continue;
        const o = document.createElement('option'); o.value = p.name; dl.appendChild(o);
      }
      draw();
    }

    // --- UI wiring
    document.getElementById('fit').onclick = fitWorld;
    document.getElementById('reset').onclick = () => loadGeoJSON(DATA_URL);
    document.getElementById('toggleFill').onclick = () => { state.fillEnabled = !state.fillEnabled; draw(); };
    document.getElementById('projection').onchange = (e)=>{ state.projection = e.target.value; fitWorld(); };

    document.getElementById('fileGeoJSON').addEventListener('change', async (e)=>{
      const f = e.target.files[0]; if (f) await loadGeoJSON(f); e.target.value='';
    });
    document.getElementById('filePoints').addEventListener('change', async (e)=>{
      const f = e.target.files[0]; if (!f) return;
      try {
        const arr = JSON.parse(await f.text());
        loadPointsArray(arr);
      } catch (err) { alert('Invalid Points JSON: ' + err); }
      e.target.value='';
    });

    document.getElementById('addSample').onclick = ()=>{
      loadPointsArray([
        { name:'Vienna', lon:16.3738, lat:48.2082 },
        { name:'Cairo', lon:31.2357, lat:30.0444 },
        { name:'New York', lon:-74.0060, lat:40.7128 },
        { name:'Tokyo', lon:139.6917, lat:35.6895 },
        { name:'Sydney', lon:151.2093, lat:-33.8688 }
      ]);
    };

    const tip = document.getElementById('tooltip');
    const countriesDL = document.getElementById('countries');
    const pointsDL = document.getElementById('points');

    // Searching
    document.getElementById('searchCountry').addEventListener('keydown',(e)=>{
      if (e.key!=='Enter') return;
      const q = e.currentTarget.value.trim().toLowerCase(); if (!q) return;
      const f = state.features.find(f => (countryName(f)||'').toLowerCase()===q);
      if (f) zoomToFeature(f);
    });
    document.getElementById('searchPoint').addEventListener('keydown',(e)=>{
      if (e.key!=='Enter') return;
      const q = e.currentTarget.value.trim().toLowerCase(); if (!q) return;
      const p = state.points.find(p => (p.name||'').toLowerCase()===q);
      if (p) goTo(p.lon, p.lat, 8);
    });
    document.getElementById('clearSearch').onclick = ()=>{
      document.getElementById('searchCountry').value='';
      document.getElementById('searchPoint').value='';
    };

    // Hover + click pick
    function showTooltip(text, x, y) {
      tip.style.display='block'; tip.textContent=text;
      tip.style.left = (x + 12) + 'px'; tip.style.top = (y + 12) + 'px';
    }
    function hideTooltip(){ tip.style.display='none'; }

    let isPanning=false, panStart=[0,0];
    canvas.addEventListener('mousedown', (e)=>{ isPanning=true; panStart=[e.clientX - state.panX, e.clientY - state.panY]; });
    window.addEventListener('mouseup', ()=> isPanning=false);
    window.addEventListener('mousemove', (e)=>{
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;

      if (isPanning) {
        state.panX = e.clientX - panStart[0];
        state.panY = e.clientY - panStart[1];
        draw();
        hideTooltip();
        return;
      }

      // hover points first (priority)
      state.hoverPointIdx = -1;
      for (let i=0;i<state.points.length;i++) {
        const p = state.points[i];
        if (!p._px) continue;
        const dx = x - p._px[0], dy = y - p._px[1];
        if (dx*dx + dy*dy <= Math.pow((p._r||6)+4, 2)) {
          state.hoverPointIdx = i; break;
        }
      }
      if (state.hoverPointIdx !== -1) {
        const p = state.points[state.hoverPointIdx];
        showTooltip(`${p.name || '(unnamed)'}\n${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`, e.clientX, e.clientY);
        state.hoverCountry = null;
        draw();
        return;
      }

      // else hover countries
      hideTooltip();
      state.hoverCountry = null;
      if (state.features.length) {
        for (const f of state.features) {
          if (ctx.isPointInPath(f._path, x, y)) { state.hoverCountry = f; break; }
        }
      }
      if (state.hoverCountry) {
        showTooltip(countryName(state.hoverCountry) || 'Unknown', e.clientX, e.clientY);
      }
      draw();
    });
    canvas.addEventListener('mouseleave', ()=>{ state.hoverPointIdx=-1; state.hoverCountry=null; hideTooltip(); draw(); });

    canvas.addEventListener('click', (e)=>{
      if (state.hoverPointIdx !== -1) {
        const p = state.points[state.hoverPointIdx];
        goTo(p.lon, p.lat, 8);
      }
    });

    canvas.addEventListener('wheel', (e)=>{
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouse = [e.clientX - rect.left, e.clientY - rect.top];
      const before = pxToWorld(mouse);
      const factor = Math.exp(-e.deltaY * 0.0015);
      state.zoom = clamp(state.zoom * factor, 0.5, 50);
      const after = worldToPx(before);
      state.panX += mouse[0] - after[0];
      state.panY += mouse[1] - after[1];
      draw();
    }, { passive:false });

    canvas.addEventListener('dblclick', (e)=>{
      const rect = canvas.getBoundingClientRect();
      const mouse = [e.clientX - rect.left, e.clientY - rect.top];
      const before = pxToWorld(mouse);
      state.zoom = clamp(state.zoom * 1.8, 0.5, 50);
      const after = worldToPx(before);
      state.panX += mouse[0] - after[0];
      state.panY += mouse[1] - after[1];
      draw();
    });

    // --- Resize
    const ro = new ResizeObserver(setCanvasSize);
    ro.observe(canvas);

    // --- Init
    setCanvasSize();
    loadGeoJSON(DATA_URL); // default countries
  })();
</script>
</body>
</html>
