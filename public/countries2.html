<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canvas Map + Points (search & zoom)</title>
  <style>
      :root { --bg:#0f172a; --panel:#111827cc; --text:#e5e7eb; --muted:#94a3b8; --accent:#22d3ee; }
      html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #wrap { position:fixed; inset:0; }
      canvas { width:100%; height:100%; display:block; }
      #ui {
          position: fixed; top: 16px; left: 16px; z-index: 3;
          background: var(--panel); backdrop-filter: blur(8px);
          border-radius: 16px; box-shadow: 0 10px 30px #0008; padding: 14px; max-width: 420px;
      }
      #ui h1 { margin:0 0 8px; font-size:16px; font-weight:700; }
      #ui .row { display:flex; gap:8px; margin:6px 0; align-items:center; flex-wrap:wrap; }
      #ui input[type="text"], #ui button, #ui select, #ui label.upload {
          border:1px solid #334155; background:#0b1220; color:var(--text);
          padding:8px 10px; border-radius: 10px; outline:none;
      }
      #ui input[type="text"]{ flex:1; min-width:200px; }
      #ui button { cursor:pointer; }
      #ui small { color: var(--muted); display:block; margin-top:6px; }
      label.upload { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
      label.upload input { display:none; }
      #tooltip {
          position: fixed; pointer-events:none; background:#0b1220; border:1px solid #334155;
          color:var(--text); padding:6px 8px; border-radius:10px; font-size:12px; display:none; z-index: 4;
          box-shadow: 0 10px 25px #0008;
      }
      #legend {
          position: fixed; right: 16px; bottom: 16px; background: #111827cc; color: var(--muted);
          padding:10px 12px; border-radius:12px; font-size:12px; z-index:3; backdrop-filter: blur(8px);
      }
      .pill { padding: 4px 8px; border:1px solid #334155; border-radius:999px; }
      .sep { color:#334155; margin:0 4px; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="map"></canvas>

  <div id="ui">
    <h1>Canvas World + Point Layer</h1>

    <div class="row">
      <button id="fitWorld">Fit world</button>
      <button id="resetWorld">Reset</button>
      <select id="projection">
        <option value="mercator" selected>Mercator</option>
        <option value="equirect">Equirectangular</option>
      </select>
      <button id="toggleFill">Toggle fill</button>
    </div>

    <div class="row">
      <input id="search" list="searchlist" placeholder="Search country or point name… or type 48.2082,16.3738" />
      <button id="go">Go</button>
      <button id="clear">✕</button>
    </div>
    <datalist id="searchlist"></datalist>

    <div class="row">
      <label class="upload" title="Load Points JSON/GeoJSON">
        <span class="pill">＋ Load Points</span>
        <input id="filePoints" type="file" accept=".json,.geojson,application/geo+json,application/json" />
      </label>
      <span class="sep">|</span>
      <label class="upload" title="Load Countries GeoJSON">
        <span class="pill">＋ Load Countries</span>
        <input id="fileCountries" type="file" accept=".json,.geojson,application/geo+json,application/json" />
      </label>
    </div>

    <small>
      Points JSON formats:
      <ul style="margin:6px 0 0 16px;padding:0;">
        <li>Plain: <code>[{"name":"Vienna","lat":48.2082,"lon":16.3738}, ...]</code></li>
        <li>GeoJSON: <code>FeatureCollection</code> of <code>Point</code> features with <code>properties.name</code></li>
      </ul>
    </small>
  </div>

  <div id="legend">Drag = pan · Wheel/trackpad = zoom · Hover = name · Click = zoom to · Double-click = zoom in</div>
  <div id="tooltip"></div>
</div>

<script>
  (() => {
    // --- Data URLs (swap if you like) ---
    const COUNTRIES_URL = 'https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson';

    // --- Canvas & state ---
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    let dpr = Math.max(1, window.devicePixelRatio || 1);

    const state = {
      countries: [],
      points: [],         // {name, lon, lat}
      fillEnabled: true,
      projection: 'mercator',
      world: { minX:-180, maxX:180, minY:null, maxY:null },
      baseScale: 1, zoom: 1, panX: 0, panY: 0, marginX: 0, marginY: 0,
      hoverCountry: null,
      hoverPoint: null
    };

    // --- Projection helpers ---
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const rad = (d) => d * Math.PI / 180;
    const mercY = (lat) => {
      const max = 85.05112878;
      const φ = rad(clamp(lat, -max, max));
      return Math.log(Math.tan(Math.PI/4 + φ/2)) * 180/Math.PI;
    };
    const projectFns = {
      mercator: (lon, lat) => [lon, mercY(lat)],
      equirect: (lon, lat) => [lon, lat]
    };

    // --- Sizing ---
    function setCanvasSize() {
      const { clientWidth:w, clientHeight:h } = canvas;
      dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      fitWorld();
    }

    function computeWorldYBounds() {
      const proj = projectFns[state.projection];
      let yTop = proj(0, 90)[1], yBottom = proj(0, -90)[1];
      if (state.projection === 'mercator') {
        yTop = mercY(85.05112878);
        yBottom = mercY(-85.05112878);
      }
      state.world.minY = Math.min(yTop, yBottom);
      state.world.maxY = Math.max(yTop, yBottom);
    }

    function fitWorld() {
      computeWorldYBounds();
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      const worldW = state.world.maxX - state.world.minX; // 360
      const worldH = state.world.maxY - state.world.minY;
      const scaleX = cw / worldW;
      const scaleY = ch / worldH;
      state.baseScale = Math.min(scaleX, scaleY);
      state.marginX = (cw - worldW * state.baseScale) / 2;
      state.marginY = (ch - worldH * state.baseScale) / 2;
      state.zoom = 1; state.panX = 0; state.panY = 0;
      draw();
    }

    function worldToPx([wx, wy]) {
      const x = (wx - state.world.minX) * state.baseScale * state.zoom + state.marginX + state.panX;
      const y = (state.world.maxY - wy) * state.baseScale * state.zoom + state.marginY + state.panY;
      return [x, y];
    }
    function pxToWorld([px, py]) {
      const wx = (px - state.marginX - state.panX) / (state.baseScale * state.zoom) + state.world.minX;
      const wy = state.world.maxY - (py - state.marginY - state.panY) / (state.baseScale * state.zoom);
      return [wx, wy];
    }

    // --- Geometry build ---
    function buildCountryPaths() {
      const proj = projectFns[state.projection];
      for (const f of state.countries) {
        const geom = f.geometry;
        const buildPathForRings = (rings) => {
          const p = new Path2D();
          for (const ring of rings) {
            ring.forEach((pt, i) => {
              const [lon, lat] = pt;
              const [wx, wy] = proj(lon, lat);
              const [x, y] = worldToPx([wx, wy]);
              if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
            });
            p.closePath();
          }
          return p;
        };
        if (geom.type === 'Polygon') {
          f._path = buildPathForRings(geom.coordinates);
        } else if (geom.type === 'MultiPolygon') {
          const p = new Path2D();
          for (const poly of geom.coordinates) p.addPath(buildPathForRings(poly));
          f._path = p;
        } else {
          f._path = null;
        }
      }
    }

    // --- Draw ---
    function draw() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0,0,w,h);
      // water
      ctx.fillStyle = '#0b1220'; ctx.fillRect(0,0,w,h);

      // countries
      if (state.countries.length) {
        buildCountryPaths();
        ctx.lineWidth = Math.max(0.5, 1.2 / state.zoom);
        ctx.strokeStyle = '#0ea5e9';
        ctx.fillStyle = state.fillEnabled ? '#083344' : 'transparent';
        for (const f of state.countries) {
          if (!f._path) continue;
          if (state.fillEnabled) ctx.fill(f._path, 'evenodd');
          ctx.stroke(f._path);
        }
        // highlight hover country
        if (state.hoverCountry && state.hoverCountry._path) {
          ctx.lineWidth = Math.max(1.5, 2.2 / state.zoom);
          ctx.strokeStyle = '#22d3ee';
          ctx.fillStyle = 'rgba(34,211,238,0.15)';
          ctx.stroke(state.hoverCountry._path);
          if (state.fillEnabled) ctx.fill(state.hoverCountry._path, 'evenodd');
        }
      }

      // points
      if (state.points.length) {
        const proj = projectFns[state.projection];
        const r = Math.max(2, 4 / Math.sqrt(state.zoom)); // keep points visible
        ctx.font = `${Math.max(10, 11 / Math.sqrt(state.zoom))}px system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
        ctx.textBaseline = 'top';
        for (const p of state.points) {
          const [wx, wy] = proj(p.lon, p.lat);
          const [x, y] = worldToPx([wx, wy]);
          p._screenX = x; p._screenY = y; p._screenR = r;

          // dot
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI*2);
          ctx.fillStyle = '#eab308';
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = '#854d0e';
          ctx.stroke();

          // label (simple)
          if (!p._hideLabel) {
            ctx.fillStyle = '#e5e7eb';
            ctx.strokeStyle = '#111827';
            ctx.lineWidth = 3;
            const label = p.name ?? `${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}`;
            ctx.strokeText(label, x + r + 4, y - r - 2);
            ctx.fillText(label, x + r + 4, y - r - 2);
          }
        }

        // point hover highlight
        if (state.hoverPoint) {
          ctx.beginPath();
          ctx.arc(state.hoverPoint._screenX, state.hoverPoint._screenY, r + 3, 0, Math.PI*2);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#facc15';
          ctx.stroke();
        }
      }
    }

    // --- Data loaders ---
    async function loadCountries(src) {
      const gj = await readJSON(src);
      const feats = gj.type === 'FeatureCollection' ? gj.features
        : gj.type === 'Feature' ? [gj] : [];
      const polys = feats.filter(f => f.geometry && /Polygon$/.test(f.geometry.type));
      state.countries = polys;
      refreshSearchList();
      fitWorld();
    }

    async function loadPoints(src) {
      const data = await readJSON(src);
      let pts = [];
      if (Array.isArray(data)) {
        // Plain format: [{name?, lat, lon}]
        pts = data.map(d => ({
          name: d.name ?? null,
          lat: +d.lat, lon: +d.lon
        })).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
      } else if (data && data.type === 'FeatureCollection') {
        for (const f of data.features || []) {
          if (f.geometry && f.geometry.type === 'Point') {
            const [lon, lat] = f.geometry.coordinates || [];
            pts.push({ name: (f.properties && (f.properties.name || f.properties.title)) || null,
              lat: +lat, lon: +lon });
          }
        }
      } else if (data && data.type === 'Feature' && data.geometry?.type === 'Point') {
        const [lon, lat] = data.geometry.coordinates || [];
        pts = [{ name: data.properties?.name || null, lat:+lat, lon:+lon }];
      } else {
        alert('Unsupported points format. Use array of {name,lat,lon} or GeoJSON Point(s).');
        return;
      }
      state.points = pts;
      refreshSearchList();
      draw();
    }

    async function readJSON(src) {
      if (src instanceof Blob) return JSON.parse(await src.text());
      const res = await fetch(src); return res.json();
    }

    // --- Search & zoom ---
    function countryName(f) {
      const p = f.properties || {};
      return p.ADMIN || p.NAME_LONG || p.NAME || p.name || p.admin || p.sovereignt || null;
    }

    function refreshSearchList() {
      const dl = document.getElementById('searchlist');
      dl.innerHTML = '';
      const names = new Set();
      state.countries.forEach(f => { const n = countryName(f); if (n) names.add(n); });
      state.points.forEach(p => { if (p.name) names.add(p.name); });
      for (const n of [...names].sort()) {
        const o = document.createElement('option');
        o.value = n; dl.appendChild(o);
      }
    }

    function bboxOfFeature(f, proj) {
      let minX= Infinity, minY= Infinity, maxX= -Infinity, maxY= -Infinity;
      const add = (lon,lat) => {
        const [wx, wy] = proj(lon, lat);
        if (wx<minX) minX=wx; if (wx>maxX) maxX=wx;
        if (wy<minY) minY=wy; if (wy>maxY) maxY=wy;
      };
      const rings = (geom) => geom.type==='Polygon' ? geom.coordinates
        : geom.type==='MultiPolygon' ? geom.coordinates.flat() : [];
      for (const r of rings(f.geometry)) for (const [lon,lat] of r) add(lon,lat);
      return { minX, minY, maxX, maxY };
    }

    function animateTo(target, ms = 500) {
      const t0 = performance.now();
      const start = { zoom: state.zoom, panX: state.panX, panY: state.panY, baseScale: state.baseScale, marginX: state.marginX, marginY: state.marginY };
      function frame(t) {
        const k = Math.min(1, (t - t0) / ms);
        const e = 1 - Math.pow(1 - k, 3); // ease-out
        for (const key of Object.keys(target)) {
          state[key] = start[key] + (target[key] - start[key]) * e;
        }
        draw();
        if (k < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function zoomToCountryByName(name) {
      const f = state.countries.find(f => (countryName(f)||'').toLowerCase() === name.toLowerCase());
      if (!f) return false;
      const proj = projectFns[state.projection];
      const bb = bboxOfFeature(f, proj);
      zoomToProjectedBBox(bb, 0.85);
      return true;
    }

    function zoomToPoint(point, targetPx = 0.25) {
      // targetPx: fraction of canvas height used for scale (bigger => more zoom-in)
      const proj = projectFns[state.projection];
      const [wx, wy] = proj(point.lon, point.lat);
      const [cx, cy] = worldToPx([wx, wy]);
      const cw = canvas.clientWidth, ch = canvas.clientHeight;

      // We want the point at screen center, and adjust zoom to a reasonable level
      const targetZoom = clamp(Math.max(2, state.zoom, 1 / (targetPx)), 0.5, 50);
      const dx = (cw/2 - cx);
      const dy = (ch/2 - cy);
      animateTo({
        zoom: targetZoom,
        panX: state.panX + dx,
        panY: state.panY + dy,
        baseScale: state.baseScale,
        marginX: state.marginX,
        marginY: state.marginY
      }, 600);
    }

    function zoomToProjectedBBox(bb, pad = 0.9) {
      const cw = canvas.clientWidth, ch = canvas.clientHeight;
      const wW = Math.max(1e-6, bb.maxX - bb.minX), wH = Math.max(1e-6, bb.maxY - bb.minY);
      const scaleX = cw / wW, scaleY = ch / wH;
      const baseScale = Math.min(scaleX, scaleY) * pad;
      const marginX = (cw - wW * baseScale) / 2 - (bb.minX - state.world.minX) * baseScale;
      const marginY = (ch - wH * baseScale) / 2 - (state.world.maxY - bb.maxY) * baseScale;
      animateTo({ baseScale, marginX, marginY, zoom: 1, panX: 0, panY: 0 }, 600);
    }

    function parseLatLon(text) {
      // Accept "lat,lon" or "lat lon". Optional spaces.
      const m = text.trim().match(/^(-?\d+(?:\.\d+)?)\s*,?\s+(-?\d+(?:\.\d+)?)$/);
      if (!m) return null;
      const lat = +m[1], lon = +m[2];
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
      return { lat, lon };
    }

    // --- Events: hover/click/pan/zoom ---
    const tooltip = document.getElementById('tooltip');
    let isPanning = false, panStart = [0,0];

    function showTooltip(text, clientX, clientY) {
      tooltip.style.display = 'block';
      tooltip.textContent = text;
      tooltip.style.left = (clientX + 12) + 'px';
      tooltip.style.top = (clientY + 12) + 'px';
    }
    function hideTooltip() { tooltip.style.display = 'none'; }

    function handleHover(ev) {
      const rect = canvas.getBoundingClientRect();
      const [x,y] = [ev.clientX - rect.left, ev.clientY - rect.top];
      state.hoverCountry = null; state.hoverPoint = null;

      // check points first (feel nicer)
      const hitP = state.points.find(p => {
        if (p._screenX == null) return false;
        const dx = x - p._screenX, dy = y - p._screenY;
        return Math.hypot(dx, dy) <= (p._screenR ?? 6) + 3;
      });
      if (hitP) {
        state.hoverPoint = hitP;
        const label = hitP.name ? `${hitP.name} (${hitP.lat.toFixed(4)}, ${hitP.lon.toFixed(4)})`
          : `${hitP.lat.toFixed(4)}, ${hitP.lon.toFixed(4)}`;
        showTooltip(label, ev.clientX, ev.clientY);
        draw(); return;
      }

      // then countries
      for (const f of state.countries) {
        if (!f._path) continue;
        if (ctx.isPointInPath(f._path, x, y)) { state.hoverCountry = f; break; }
      }
      if (state.hoverCountry) {
        showTooltip(countryName(state.hoverCountry) || 'Unknown', ev.clientX, ev.clientY);
      } else hideTooltip();
      draw();
    }

    canvas.addEventListener('mousedown', (e) => {
      isPanning = true; panStart = [e.clientX - state.panX, e.clientY - state.panY];
    });
    window.addEventListener('mouseup', () => isPanning = false);
    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        state.panX = e.clientX - panStart[0];
        state.panY = e.clientY - panStart[1];
        draw();
      } else {
        handleHover(e);
      }
    });
    canvas.addEventListener('mouseleave', () => { state.hoverCountry=null; state.hoverPoint=null; hideTooltip(); draw(); });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouse = [e.clientX - rect.left, e.clientY - rect.top];
      const before = pxToWorld(mouse);
      const factor = Math.exp(-e.deltaY * 0.0015);
      const newZoom = clamp(state.zoom * factor, 0.5, 50);
      state.zoom = newZoom;
      const after = worldToPx(before);
      state.panX += mouse[0] - after[0];
      state.panY += mouse[1] - after[1];
      draw();
    }, { passive:false });

    canvas.addEventListener('dblclick', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouse = [e.clientX - rect.left, e.clientY - rect.top];
      const before = pxToWorld(mouse);
      state.zoom = clamp(state.zoom * 1.8, 0.5, 50);
      const after = worldToPx(before);
      state.panX += mouse[0] - after[0];
      state.panY += mouse[1] - after[1];
      draw();
    });

    // Click: zoom to point if near; else country
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const [x,y] = [e.clientX - rect.left, e.clientY - rect.top];
      const hitP = state.points.find(p => {
        const dx = x - (p._screenX ?? -9999), dy = y - (p._screenY ?? -9999);
        return Math.hypot(dx, dy) <= (p._screenR ?? 6) + 6;
      });
      if (hitP) { zoomToPoint(hitP); return; }
      if (state.hoverCountry) {
        const proj = projectFns[state.projection];
        const bb = bboxOfFeature(state.hoverCountry, proj);
        zoomToProjectedBBox(bb, 0.85);
      }
    });

    // --- UI wiring ---
    document.getElementById('fitWorld').onclick = fitWorld;
    document.getElementById('resetWorld').onclick = () => loadCountries(COUNTRIES_URL);
    document.getElementById('toggleFill').onclick = () => { state.fillEnabled = !state.fillEnabled; draw(); };
    document.getElementById('projection').onchange = (e) => { state.projection = e.target.value; fitWorld(); };

    document.getElementById('go').onclick = handleSearch;
    document.getElementById('clear').onclick = () => { const i = document.getElementById('search'); i.value=''; i.focus(); };
    document.getElementById('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });

    function handleSearch() {
      const val = document.getElementById('search').value.trim();
      if (!val) return;
      // 1) lat,lon?
      const ll = parseLatLon(val.replace(/,/g, ' , ').replace(/\s+/g, ' ').replace(' , ', ','));
      if (ll) { zoomToPoint({ name: null, ...ll }); return; }
      // 2) point name?
      const p = state.points.find(p => (p.name||'').toLowerCase() === val.toLowerCase());
      if (p) { zoomToPoint(p); return; }
      // 3) country name?
      if (zoomToCountryByName(val)) return;
      alert('Not found: try exact point/country name or a "lat, lon" pair.');
    }

    // File inputs
    document.getElementById('filePoints').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if (f) await loadPoints(f);
      e.target.value = '';
    });
    document.getElementById('fileCountries').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if (f) await loadCountries(f);
      e.target.value = '';
    });

    // Resize observer
    const ro = new ResizeObserver(setCanvasSize);
    ro.observe(canvas);

    // Expose simple API for quick testing in console:
    window.addPoint = (name, lon, lat) => {
      state.points.push({ name, lon:+lon, lat:+lat });
      refreshSearchList(); draw();
    };
    window.clearPoints = () => { state.points = []; refreshSearchList(); draw(); };

    // Init
    setCanvasSize();
    loadCountries(COUNTRIES_URL);

    // Optional: load points from URL param ?points=https://.../points.json
    const urlPoints = new URLSearchParams(location.search).get('points');
    if (urlPoints) loadPoints(urlPoints);
  })();
</script>
</body>
</html>
