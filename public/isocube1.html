<!DOCTYPE html>
<html>
<head>
  <title>Simple Isometric Cube</title>
</head>
<body>
<canvas id="isometricCube" width="400" height="400"></canvas>
<script>
  // Get the canvas element and its context
  var canvas = document.getElementById("isometricCube");
  var ctx = canvas.getContext("2d");

  // Set the origin point for the isometric cube
  var startX = 200; // Adjust this value to position the cube
  var startY = 200; // Adjust this value to position the cube
  var size = 100;   // Adjust this value to change the size of the cube

  // Clear the canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Function to draw a simple isometric cube
  function drawIsometricCube(x, y, size) {
    // Draw front square
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + size, y - size * 0.5);
    ctx.lineTo(x + size, y - size * 1.5);
    ctx.lineTo(x, y - size * 1);
    ctx.closePath();
    ctx.stroke();

    // Draw rear square
    ctx.beginPath();
    ctx.moveTo(x, y - size * 1);
    ctx.lineTo(x + size, y - size * 0.5);
    ctx.lineTo(x + size, y - size * 1.5);
    ctx.lineTo(x, y - size * 2);
    ctx.closePath();
    ctx.stroke();

    // Connect the two squares
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y - size);
    ctx.moveTo(x + size, y - size * 0.5);
    ctx.lineTo(x + size, y - size * 1.5);
    ctx.moveTo(x, y - size);
    ctx.lineTo(x, y - size * 2);
    ctx.stroke();
  }

  // Call the drawIsometricCube function to draw the cube
  drawIsometricCube(startX, startY, size);
</script>
</body>
</html>
