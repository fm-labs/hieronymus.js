<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roulette Wheel</title>
    <style>
      canvas {
        display: block;
        margin: 20px auto;
        background-color: #333;
      }
      button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="rouletteCanvas" width="500" height="500"></canvas>
    <button onclick="spinWheel()">Spin the Wheel</button>

    <script>
      const canvas = document.getElementById('rouletteCanvas')
      const ctx = canvas.getContext('2d')
      const centerX = canvas.width / 2
      const centerY = canvas.height / 2
      const radius = 200
      const numbers = [
        '0',
        '32',
        '15',
        '19',
        '4',
        '21',
        '2',
        '25',
        '17',
        '34',
        '6',
        '27',
        '13',
        '36',
        '11',
        '30',
        '8',
        '23',
        '10',
        '5',
        '24',
        '16',
        '33',
        '1',
        '20',
        '14',
        '31',
        '9',
        '22',
        '18',
        '29',
        '7',
        '28',
        '12',
        '35',
        '3',
        '26',
      ]

      let rotationAngle = 0
      let spinSpeed = 0 // Speed of rotation
      let spinning = false

      function drawRouletteWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        const anglePerSlice = (2 * Math.PI) / numbers.length

        // Rotate the entire wheel
        ctx.save()
        ctx.translate(centerX, centerY)
        ctx.rotate(rotationAngle)
        ctx.translate(-centerX, -centerY)

        // Draw each slice of the wheel
        for (let i = 0; i < numbers.length; i++) {
          const angleStart = i * anglePerSlice
          const angleEnd = (i + 1) * anglePerSlice

          if (numbers[i] === '0') {
            ctx.fillStyle = '#00FF00'
          } else if (i % 2 === 0) {
            ctx.fillStyle = '#FF0000'
          } else {
            ctx.fillStyle = '#000000'
          }

          ctx.beginPath()
          ctx.moveTo(centerX, centerY)
          ctx.arc(centerX, centerY, radius, angleStart, angleEnd)
          ctx.closePath()
          ctx.fill()

          // Draw the numbers on the wheel
          ctx.save()
          ctx.translate(centerX, centerY)
          ctx.rotate(angleStart + anglePerSlice / 2)
          ctx.textAlign = 'center'
          ctx.fillStyle = '#FFFFFF'
          ctx.font = '16px Arial'
          ctx.fillText(numbers[i], radius - 30, 10)
          ctx.restore()
        }

        ctx.restore()

        // Draw the pointer
        ctx.fillStyle = '#FFFFFF'
        ctx.beginPath()
        ctx.moveTo(centerX, centerY - radius - 10)
        ctx.lineTo(centerX - 10, centerY - radius + 20)
        ctx.lineTo(centerX + 10, centerY - radius + 20)
        ctx.closePath()
        ctx.fill()

        // Draw the outer circle
        ctx.lineWidth = 4
        ctx.strokeStyle = '#FFFFFF'
        ctx.beginPath()
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI)
        ctx.stroke()
      }

      function spinWheel() {
        if (spinning) return

        spinning = true
        spinSpeed = Math.random() * 0.3 + 0.2 // Random initial speed
        const deceleration = 0.005 // Slows down over time

        function animate() {
          if (spinSpeed > 0) {
            rotationAngle += spinSpeed
            rotationAngle %= 2 * Math.PI // Keep angle within bounds
            spinSpeed -= deceleration // Gradually reduce speed

            drawRouletteWheel()
            requestAnimationFrame(animate) // Continue animation
          } else {
            spinning = false
            const winningNumberIndex =
              Math.floor(((2 * Math.PI - rotationAngle) / (2 * Math.PI)) * numbers.length) %
              numbers.length
            alert('Winning Number: ' + numbers[winningNumberIndex])
          }
        }

        animate() // Start the animation
      }

      drawRouletteWheel() // Initial draw of the wheel
    </script>
  </body>
</html>
